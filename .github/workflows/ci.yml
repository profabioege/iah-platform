name: CI

# Gate obrigatório de qualidade (Etapa Zero da D-047). CI e CD são
# processos distintos: este workflow NÃO faz deploy — apenas impede que
# código quebrado chegue à main. O deploy continua sendo da Vercel.
#
# Nenhum segredo, nenhum acesso ao Supabase remoto. O único banco tocado
# é o service container PostgreSQL efêmero abaixo (credenciais
# descartáveis, existe só durante o job) — usado apenas pelos testes de
# integração da fila de jobs (Micro Missão 3).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Menor permissão possível: só ler o código.
permissions:
  contents: read

# Uma execução por ref: push novo cancela o anterior da mesma branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: IAH Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # PostgreSQL efêmero só para os testes de integração da fila de jobs
    # (Micro Missão 3) — usuário, senha e banco descartáveis, sem volume,
    # nunca o Supabase remoto. Ver app/scripts/postgres-test-env.mjs.
    services:
      postgres:
        image: postgres:16.4
        env:
          POSTGRES_USER: iah_test
          POSTGRES_PASSWORD: iah_test_only_ci
          POSTGRES_DB: iah_jobs_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        # O projeto Next.js vive na subpasta app/ (mesma Root Directory
        # configurada na Vercel — ver docs/DEPLOY.md).
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          # Node 22 é obrigatório: `npm test` usa --experimental-strip-types,
          # que não existe no Node 20.
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      # 1. Instalação determinística — falha se o lockfile divergir.
      - name: Instalar dependências (npm ci)
        run: npm ci

      # 2. Migrations: verificação estática, sem banco (ver o script).
      - name: Verificar migrations
        run: npm run migrations:check

      # 3. Lint
      - name: Lint
        run: npm run lint

      # 4. Tipos, sem emitir arquivos
      - name: TypeScript
        run: npx tsc --noEmit

      # 5. Testes
      - name: Testes
        run: npm test

      # 5b. Testes de integração/concorrência da fila contra PostgreSQL
      # real (Micro Missão 3) — usa o service container acima, nunca o
      # Supabase remoto. Nenhuma secret: credenciais só existem nesta
      # execução e no banco descartável.
      - name: Testes de integração (PostgreSQL)
        run: npm run test:integration:postgres
        env:
          TEST_DATABASE_URL: postgresql://iah_test:iah_test_only_ci@localhost:5432/iah_jobs_test

      # 6. Build de produção.
      # Sem variáveis de ambiente: next.config.ts calcula
      # NEXT_PUBLIC_IAH_REAL_MODE a partir de env ausentes e resolve para
      # "false" — o build roda em modo demonstração, sem tocar em nenhum
      # serviço remoto. É exatamente o que queremos verificar na CI.
      - name: Build
        run: npm run build
